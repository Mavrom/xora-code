name: Release

# Builds the universal macOS app (Apple silicon + Intel) as a .dmg and the Windows
# installers (.exe setup and .msi).
# - Tag `v1.2.3` (matching the version in tauri.conf.json) or run it by hand:
#   uploads them to a draft GitHub release, published once you review it.
# - Pull requests that touch this file: build only, the files are workflow artifacts.
#
# Windows builds come from here, never from a local LLVM-MinGW toolchain: that one links
# libunwind.dll and WebView2Loader.dll dynamically, and the installed app fails to start
# on any machine without them. MSVC links both statically.
#
# Signing: without secrets the app is ad-hoc signed (Gatekeeper asks once on first
# launch). With these repository secrets it is signed with a Developer ID and notarized:
# APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # Only export the signing variables that are set: an empty APPLE_CERTIFICATE
      # would make the Tauri CLI try (and fail) to import it.
      - name: Signing environment
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              { echo "$name<<__XORA_EOF__"; echo "$value"; echo "__XORA_EOF__"; } >> "$GITHUB_ENV"
            fi
          done

      - name: Build
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ github.event_name != 'pull_request' && 'v__VERSION__' || '' }}
          releaseName: ${{ github.event_name != 'pull_request' && 'Xora Code v__VERSION__' || '' }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ### Windows 10 and 11 (x64)
            Download **`Xora.Code_*_x64-setup.exe`** (or the `.msi`) and run it. The installer is not code-signed yet, so SmartScreen may warn: *More info → Run anyway*.

            ### macOS 11 or newer
            Download **`Xora.Code_*_universal.dmg`** (Apple silicon and Intel), open it and drag Xora Code into Applications.

            The app is not notarized yet, so macOS blocks the first launch: open it once, then choose **System Settings → Privacy & Security → Open Anyway**. If macOS says the app "is damaged", run `xattr -cr "/Applications/Xora Code.app"` in Terminal and open it again.

            Agents need [Node.js](https://nodejs.org/) 22 or newer.

      - uses: actions/upload-artifact@v4
        with:
          name: xora-code-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    # After macOS, so a tag push creates its draft release once instead of racing for it.
    needs: macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name != 'pull_request' && 'v__VERSION__' || '' }}
          releaseName: ${{ github.event_name != 'pull_request' && 'Xora Code v__VERSION__' || '' }}
          releaseDraft: true
          prerelease: false

      # The installed app must start on a bare Windows: no MinGW runtime or loader DLLs.
      - name: Check DLL imports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents src-tauri\target\release\xora-code.exe
          $deps
          $bad = $deps | Select-String -Pattern 'libunwind|libgcc|libstdc\+\+|libc\+\+|WebView2Loader'
          if ($bad) { Write-Error "xora-code.exe needs DLLs the installer does not ship: $bad"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: xora-code-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
