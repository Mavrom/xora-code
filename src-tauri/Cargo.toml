[package]
name = "xora-code"
version = "0.1.0"
description = "Open-source, agent-first code editor"
authors = ["Xora Code contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.88"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xora_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
thiserror = "2"
# Phase 2 ACP agent core (design doc 3.1)
agent-client-protocol-schema = { version = "=1.12.0", default-features = false }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }
uuid = { version = "1", features = ["v4"] }
# Windows canonicalize without the \\?\ prefix (fs sandbox, package B)
dunce = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
